  <link rel="stylesheet" href="./styles.css">

<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">Sanmei-gaku chart calculator</p>
        <h1>算命学鑑定 by SATSUKI</h1>
        <p class="subcopy">生年月日と大運計算の性別区分から、陰占・陽占・大運・年運・月運を算出します。</p>
      </div>
      <div class="formula-note">
        算命学の節月は二十四節気の「節」で切り替えます。年運・月運は指定した年を中心に表示します。
      </div>
    </header>

    <form class="input-panel" id="chartForm">
      <label class="field">
        <span>生年月日</span>
        <input id="birthDate" type="date" required>
      </label>
      <label class="field">
        <span>大運計算</span>
        <select id="gender">
          <option value="male">男性式</option>
          <option value="female">女性式</option>
        </select>
      </label>
      <label class="field">
        <span>年運・月運の年</span>
        <input id="targetYear" type="number" min="1900" max="2100" step="1">
      </label>
      <button type="submit">算出</button>
    </form>

    <p class="error" id="errorBox"></p>

    <section class="summary-grid" id="summary"></section>
    <section class="panel day-reading-panel" id="dayReadingPanel"></section>
    <section class="panel tenchusatsu-panel" id="tenchusatsuPanel"></section>

    <div class="workspace">
      <div class="stack">
        <section class="panel" id="yinPanel"></section>
        <section class="panel" id="yangPanel"></section>
      </div>

      <div class="stack">
        <section class="panel" id="balancePanel"></section>
      </div>
    </div>

    <div class="luck-sections">
      <section class="panel" id="bigLuckPanel"></section>
      <section class="panel" id="yearLuckPanel"></section>
      <section class="panel" id="monthLuckPanel"></section>
      <section class="panel monthly-guide-panel" id="monthlyGuidePanel"></section>
    </div>

    <p class="disclaimer">
      これは鑑定アプリのMVPです。二十四節気は太陽黄経の近似計算、蔵干は節入りからの経過日数で選ぶ方式です。
      流派差、出生地、23時以降の日替わり扱い、節入り時刻の厳密値を商用・鑑定用途で使う場合は、採用流派の暦データで照合してください。
    </p>
  </main>

      const entries = Object.entries(chart.balance);
      const max = Math.max(...entries.map(([, value]) => value));
      const strongest = entries.filter(([, value]) => value === max).map(([element]) => element);
      const main = strongest[0];
      const reading = ELEMENT_BALANCE_READING[main];

      if (strongest.length > 1) {
        return {
          title: `強い五行：${strongest.join("・")}`,
          meaning: `${strongest.join("・")}が強めに出ています。複数の性質が前に出るため、状況によって魅力の出方が変わります。`,
          action: "対策：一番疲れやすい場面を観察し、休む・整理する・人に任せるなど、流れを詰まらせない工夫をしてください。"
        };
      }

      return {

        meaning: reading.meaning,
        action: reading.action
      };

      };

    function bigLuckCycle(chart) {
      const cycleAge = Math.max(1, Math.floor(chart.startAge));
      const ages = Array.from({ length: 6 }, (_, index) => cycleAge + index * 10);
      return {
        age: cycleAge,
        label: `${cycleAge}年運`,
        ages,
        text: `${ages.map((age) => `${age}歳`).join("・")}…のように、10年ごとに大運が切り替わります。`
      };
    }

    function bigLuckAgeRange(chart, index) {
      const cycle = bigLuckCycle(chart);
      const start = cycle.age + index * 10;
      return `${start}歳〜${start + 9}歳`;
    }

        { place: "右足 / 晩年運", value: chart.yang.later.name, extra: `${chart.yang.later.energy}点` },
        { place: "腹 / 南", value: chart.yang.south, extra: "部下・子供" },
        { place: "左足 / 中年運", value: chart.yang.middle.name, extra: `${chart.yang.middle.energy}点` }
      ];
      $("#yangPanel").innerHTML = `
        <div class="panel-header">
          <h2>陽占</h2>
          <span class="meta">人体星図</span>
        </div>
        <div class="yang-grid">
          ${cells.map((cell) => `
            <div class="yang-cell ${cell.empty ? "empty" : ""}">
              <div class="yang-place">${cell.place}</div>
              <div class="yang-star">${cell.value || " "}</div>
              <div class="energy">${cell.extra}</div>
            </div>
          `).join("")}
        </div>
        ${renderTenStarReading(chart)}
        ${renderLifeGraph(chart)}
        ${renderLifeStageReading(chart)}
      `;
    }

    function renderBalance(chart) {
      const max = Math.max(...Object.values(chart.balance), 1);
      const reading = balanceReading(chart);
      $("#balancePanel").innerHTML = `
        <div class="panel-header">
          <h2>五行バランス</h2>
          <span class="meta">天干・地支・蔵干</span>
        </div>
        <div class="balance">
          ${api.ELEMENT_ORDER.map((element) => `
            <div class="bar-row">
              <strong>${element}</strong>
              <div class="bar-track"><div class="bar element-${element}" style="width:${chart.balance[element] / max * 100}%"></div></div>
              <span>${chart.balance[element]}</span>
            </div>
          `).join("")}
        </div>
        <div class="balance-reading">
          <div class="balance-reading-title">${reading.title}</div>
          <p><strong>意味：</strong>${reading.meaning}</p>
          <p><strong>対策：</strong>${reading.action.replace(/^対策：/, "")}</p>
        </div>
      `;
    }

    function renderBigLuck(chart) {
      const flow = bigLuckFlow(chart);
      const cycle = bigLuckCycle(chart);
      $("#bigLuckPanel").innerHTML = `
        <div class="panel-header">
          <h2>大運</h2>
          <span class="meta">${cycle.label} / ${flow.label}</span>
        </div>
        <p class="panel-note">${cycle.text} ${flow.note}</p>
        <div class="table-wrap">
          <table class="luck-table theme-table">
            <thead>
              <tr><th>旬</th><th>年齢</th><th>干支</th><th>星</th><th>テーマ</th></tr>
            </thead>
            <tbody>
              ${chart.bigLuck.map((luck, index) => `
                <tr>
                  <td>${luck.index}旬</td>
                  <td>${bigLuckAgeRange(chart, index)}</td>
                  <td><span class="kan">${luck.label}</span></td>
                  <td class="star-cell">${luckStars(luck)}</td>
                  <td class="theme-cell">${themeForLuck(luck, "decade")}</td>
                </tr>
              `).join("")}
            </tbody>
          </table>
        </div>
      `;
    }

    function renderYearLuck(chart) {
      const tenchusatsu = tenchusatsuForChart(chart);
      $("#yearLuckPanel").innerHTML = `
        <div class="panel-header">
          <h2>年運</h2>
          <span class="meta">${chart.targetYear - 5}〜${chart.targetYear + 5}</span>
        </div>
        <div class="table-wrap">
          <table class="theme-table year-theme-table">
            <thead><tr><th>年</th><th>星</th><th>テーマ</th></tr></thead>
            <tbody>
              ${chart.yearLucks.map((luck) => {
                const isTenchu = isTenchusatsuLuck(tenchusatsu, luck);
                return `
                <tr class="${isTenchu ? "is-tenchusatsu-year" : ""}">
                  <td>${luck.year}</td>
                  <td class="star-cell">
                    ${luckStars(luck)}
                    ${isTenchu ? `<span class="tenchu-badge">${tenchusatsu.name}</span>` : ""}
                  </td>
                  <td class="theme-cell">
                    ${isTenchu ? `<div class="theme-stars">天中殺年</div>${tenchusatsu.yearAdvice}` : themeForLuck(luck, "year")}
                  </td>
                </tr>
              `;
              }).join("")}
            </tbody>
          </table>
        </div>
      `;
    }

    function renderMonthLuck(chart) {
      $("#monthLuckPanel").innerHTML = `
        <div class="panel-header">
          <h2>月運</h2>
          <span class="meta">${chart.targetYear}年の節月</span>
        </div>
        <div class="table-wrap">
          <table class="theme-table month-theme-table">
            <thead><tr><th>日付</th><th>テーマ</th></tr></thead>
            <tbody>
              ${chart.monthLucks.map((luck) => `
                <tr>
                  <td>${api.formatJst(luck.start, false)}</td>
                  <td class="theme-cell">
                    <div class="theme-stars">${luck.tenStar} / ${luck.lifeStar.name}</div>
                    ${themeForLuck(luck, "month")}
                  </td>
                </tr>
              `).join("")}
            </tbody>
          </table>
        </div>
      `;
    }

    function renderAll(chart) {
      renderSummary(chart);
      renderDayPillarReading(chart);
      renderTenchusatsu(chart);
      renderYin(chart);
      renderYang(chart);
      renderBalance(chart);
      renderBigLuck(chart);
      renderYearLuck(chart);
      renderMonthLuck(chart);
      renderMonthlyGuide(chart);
    }

    function calculateFromForm() {
      const errorBox = $("#errorBox");
      errorBox.classList.remove("is-visible");
      try {
        const targetYear = Number($("#targetYear").value);
        const chart = api.calculateNatal({
          dateValue: $("#birthDate").value,
          gender: $("#gender").value,
          targetYear
        });
        renderAll(chart);
      } catch (error) {
        errorBox.textContent = error.message;
        errorBox.classList.add("is-visible");
      }
    }

    $("#chartForm").addEventListener("submit", (event) => {
      event.preventDefault();
      calculateFromForm();
    });

    setDefaults();
    calculateFromForm();
  </script>
</body>
</html>
